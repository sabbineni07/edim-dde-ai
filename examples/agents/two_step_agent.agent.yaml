# =============================================================================
# two_step_agent — set_value templates
# =============================================================================
# Teaches: chaining nodes; template: "…{field}…" reads prior state keys.
# Run:
#   edim-dde-ai run two_step_agent --yaml examples/agents/two_step_agent.agent.yaml \
#     --input '{"message":"ping"}'
# =============================================================================

agent_id: two_step_agent
display_name: Two Step Agent
version: 1

entry:
  method: invoke
  sync: true

graph:
  nodes:
    - id: step_one
      type: set_value
      field: step
      value: 1

    - id: step_two
      type: set_value
      field: label
      # template: substitutes {identifier} from current state (unknown → "").
      # Prefer template OR value, not both (template wins when present).
      template: "step={step} msg={message}"

    - id: finish
      type: echo_result
      from_fields: [step, label, message]

  edges:
    - [START, step_one]
    - [step_one, step_two]
    - [step_two, finish]
    - [finish, END]
